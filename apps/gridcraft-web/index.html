<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bina Excel Web</title>
  <link data-trunk rel="icon" href="bina-excel-app-icon.png" />
  <link data-trunk rel="copy-file" href="bina-excel-app-icon.png" />
  <link data-trunk rel="copy-file" href="bina-corp-logo.png" />
  <link data-trunk rel="copy-file" href="bina-excel-banner.png" />
  <link data-trunk rel="copy-file" href="portal.css" />
  <link data-trunk rel="copy-file" href="portal.js" />
  <link data-trunk rel="rust" data-bin="gridcraft-web" data-wasm-opt="z" data-weak-refs />
  
  <link rel="stylesheet" href="portal.css" />
  <style>
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #gridcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #007BFF; font: 15px system-ui, sans-serif; font-weight: 500; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Spreadsheet Canvas -->
  <canvas id="gridcraft_canvas"></canvas>
  <div id="gridcraft_loading">Memuat Bina Excel&hellip;</div>



  <!-- ==================== HALAMAN 1: LOGIN (2-Step Minimalis) ==================== -->
  <div id="bina_login_modal">
    <!-- Header Logo -->
    <header class="login-header">
      <div class="logo-group">
        <img src="bina-corp-logo.png" alt="BINA" class="logo-bina" />
        <div class="logo-divider"></div>
        <img src="bina-excel-app-icon.png" alt="Bina Excel" class="logo-app" />
      </div>
    </header>

    <!-- Center Stage Form -->
    <main class="center-stage">
      <div class="form-slider-container">
        <!-- Step 1: Input NIK -->
        <form id="step_nik" class="step-card active" autocomplete="off">
          <div class="input-line-group">
            <input
              id="bina_nik"
              type="text"
              placeholder="NIK"
              class="clean-input"
              autocomplete="username"
              autofocus
              required
            />
            <button type="submit" id="btn_next_nik" class="arrow-square-btn" title="Lanjut">
              <svg class="arrow-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
            <div class="animated-focus-line"></div>
          </div>

          <!-- Tombol OAuth Google -->
          <button type="button" id="btn_google_login" class="google-oauth-btn">
            <svg class="google-svg" viewBox="0 0 24 24" width="16" height="16">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="google-text">Login dengan Google</span>
          </button>
        </form>

        <!-- Step 2: Input Password -->
        <form id="step_password" class="step-card" autocomplete="off">
          <div class="input-line-group">
            <input
              id="bina_password"
              type="password"
              placeholder="password"
              class="clean-input"
              autocomplete="current-password"
              required
            />
            <button type="submit" id="btn_submit_login" class="arrow-square-btn" title="Masuk">
              <svg id="pw_arrow_icon" class="arrow-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
              <div id="pw_spinner" class="btn-spinner" style="display: none;"></div>
            </button>
            <div class="animated-focus-line"></div>
          </div>

          <div class="step-footer-actions">
            <button type="button" id="btn_back_to_nik" class="btn-back-nik">
              <span>&larr;</span> Ganti NIK
            </button>
          </div>

          <!-- Pesan Error -->
          <div id="login_error_msg" class="error-msg-container" style="display: none;">
            <span id="login_error_text">NIK atau kata sandi tidak sesuai</span>
          </div>
        </form>
      </div>
    </main>

    <!-- Footer Banner -->
    <footer class="login-footer-banner">
      <img src="bina-excel-banner.png" alt="BINA EXCEL" class="giant-wordmark" />
    </footer>
  </div>

  <!-- ==================== HALAMAN 2: BERANDA (WORKSPACE HUB) ==================== -->
  <div id="bina_dashboard" class="bina-dashboard hidden">
    <!-- 1. Top Bar Header (Logo, Search Pill, Profile Avatar) -->
    <header class="dash-topbar">
      <div class="dash-brand">
        <img src="bina-excel-app-icon.png" alt="Bina Excel" class="dash-logo" />
        <span class="dash-brand-title">Bina Excel</span>
      </div>

      <!-- Search Pill Bar -->
      <div class="dash-search-container">
        <div class="dash-search-pill">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            id="dash_search_input"
            type="text"
            placeholder="Telusuri"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>

      <!-- User Avatar Profile & Popover -->
      <div class="dash-user-section">
        <div id="dash_user_avatar_btn" class="dash-avatar-wrapper" title="Profil Karyawan">
          <img id="dash_user_avatar_img" src="" alt="Avatar" class="dash-avatar-img" style="display: none;" />
          <div id="dash_user_avatar_fallback" class="dash-avatar-fallback">K</div>
        </div>

        <!-- User Popover Card -->
        <div id="dash_user_popover" class="dash-user-popover hidden">
          <div class="popover-avatar-large">
            <img id="popover_avatar_img" src="" alt="Avatar" style="display: none;" />
            <div id="popover_avatar_fallback" class="popover-avatar-letter">K</div>
          </div>
          <div class="popover-user-name" id="popover_user_name">Karyawan</div>
          <div class="popover-user-nik" id="popover_user_nik">NIK: -</div>
          <div class="popover-user-org">PT Bina Buah Nusantara</div>
          <div class="popover-divider"></div>
          <button id="dash_btn_logout" class="popover-logout-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Keluar dari Akun
          </button>
        </div>
      </div>
    </header>

    <!-- 2. Main Dashboard Content -->
    <main class="dash-content">
      <!-- Section: Create New Workspace -->
      <section class="dash-section new-workspace-section">
        <h2 class="dash-section-title">Create new workspace</h2>
        <div id="btn_create_workspace" class="workspace-card" title="Buat spreadsheet baru">
          <!-- Blue-Purple Gradient Cross Icon -->
          <svg class="gradient-plus" width="36" height="36" viewBox="0 0 36 36" fill="none">
            <defs>
              <linearGradient id="bluePurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#007BFF" />
                <stop offset="50%" stop-color="#6366F1" />
                <stop offset="100%" stop-color="#9333EA" />
              </linearGradient>
            </defs>
            <rect x="15.5" y="4" width="5" height="28" rx="2.5" fill="url(#bluePurpleGrad)" />
            <rect x="4" y="15.5" width="28" height="5" rx="2.5" fill="url(#bluePurpleGrad)" />
          </svg>
        </div>
      </section>

      <!-- Section: Files & Workspace List -->
      <section class="dash-section files-section">
        <div class="files-header-toolbar">
          <div class="files-title-group">
            <span class="files-group-label" id="files_group_label">Hari ini</span>
          </div>

          <div class="files-controls-group">
            <div class="filter-dropdown-container">
              <div class="filter-dropdown" id="filter_owner_dropdown" title="Filter kepemilikan">
                <span id="filter_owner_label">Milik saya</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
              <div class="filter-owner-popover hidden" id="filter_owner_popover">
                <div class="filter-opt active" data-filter="mine">Milik saya</div>
                <div class="filter-opt" data-filter="shared">Dibagikan kepada saya</div>
              </div>
            </div>

            <div class="sort-label">
              <span>Terakhir saya buka</span>
            </div>

            <div class="view-icons-group">
              <button class="view-icon-btn active" title="Grid View" id="btn_view_grid">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
              </button>
              <button class="view-icon-btn" title="Urutkan A-Z" id="btn_sort_az">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 4h6l-6 8h6M14 4h7M14 8h5M14 12h3M7 16v6M4 19l3 3 3-3"/>
                </svg>
              </button>
              <button class="view-icon-btn" title="Buka File Lokal" id="btn_open_local_file">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Files List Container -->
        <div id="dash_files_list" class="dash-files-list">
          <!-- Baris-baris file cloud dimuat secara dinamis oleh portal.js -->
        </div>

        <div id="dash_files_loading" class="dash-files-loading" style="display: none;">
          <div class="dash-spinner"></div>
          <span>Memuat file cloud Bina...</span>
        </div>

        <div id="dash_files_empty" class="dash-files-empty" style="display: none;">
          <p>Belum ada workspace atau file spreadsheet di drive Anda.</p>
        </div>
      </section>
    </main>

    <!-- 3. Giant Footer Wordmark Banner (Mockup 1:1) -->
    <footer class="dash-footer-banner">
      <img src="bina-excel-banner.png" alt="BINA EXCEL" class="giant-wordmark" />
    </footer>
  </div>

  <script src="portal.js"></script>
</body>
</html>
